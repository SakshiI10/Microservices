server:
  port: 8080

spring:
  application:
    name: api-Gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: User-Service
              uri: http://localhost:8081
              predicates:
                - Path=/courseApi/**

            - id: User2-Service
              uri: http://localhost:8082
              predicates:
                - Path=/studentApi/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
